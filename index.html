<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Lifestyle — Mix Brands Photos</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e5e3df;
    --text: #1c1c1a;
    --muted: #6b6b66;
    --accent: #b5651d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171715;
      --card: #211f1c;
      --border: #332f2a;
      --text: #f2f0ec;
      --muted: #a39d93;
      --accent: #e0995a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171715;
    --card: #211f1c;
    --border: #332f2a;
    --text: #f2f0ec;
    --muted: #a39d93;
    --accent: #e0995a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
  }
  header p {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 13px;
  }
  #search {
    width: 100%;
    max-width: 420px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
  }
  #count {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  main {
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .photos {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    background: #fff;
  }
  .photos img {
    flex: 0 0 100%;
    scroll-snap-align: start;
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #fff;
    display: block;
  }
  .photos::-webkit-scrollbar { height: 5px; }
  .photos::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .meta { padding: 10px 12px 12px; }
  .pid {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .name {
    font-size: 13px;
    font-weight: 500;
    margin: 2px 0 4px;
    line-height: 1.3;
  }
  .sub {
    font-size: 11px;
    color: var(--muted);
  }
  .photocount {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .hidden { display: none !important; }
  #empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>DNA Lifestyle — Mix Brands Product Photos</h1>
  <p>1,099 products with verified photos. Search by name, ID or barcode. Swipe/scroll each card to see all photos for that product.</p>
  <input id="search" type="text" placeholder="Search name, ID, or barcode…" autocomplete="off">
  <div id="count"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="empty" class="hidden">No matches.</div>
</main>
<script>
let DATA = [];
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');

function cardHTML(p) {
  const imgs = p.photos.map(u => `<img src="${u}" loading="lazy" alt="${p.name.replace(/"/g,'&quot;')}">`).join('');
  return `<div class="card" data-s="${(p.id+' '+p.name+' '+p.barcode).toLowerCase()}">
    <div class="photos">${imgs}</div>
    <div class="meta">
      <div class="pid">${p.id}</div>
      <div class="name">${p.name}</div>
      <div class="sub">${p.barcode || ''}${p.category ? ' · ' + p.category : ''}</div>
      <div class="photocount">${p.photos.length} photo${p.photos.length>1?'s':''}</div>
    </div>
  </div>`;
}

function render(list) {
  grid.innerHTML = list.map(cardHTML).join('');
  emptyEl.classList.toggle('hidden', list.length > 0);
  countEl.textContent = `Showing ${list.length} of ${DATA.length} products`;
}

function filter() {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { render(DATA); return; }
  render(DATA.filter(p => (p.id+' '+p.name+' '+p.barcode).toLowerCase().includes(q)));
}

searchEl.addEventListener('input', filter);

fetch('gallery_data.json').then(r => r.json()).then(data => {
  DATA = data;
  render(DATA);
}).catch(err => {
  grid.innerHTML = '<div style="padding:40px;color:var(--muted)">Failed to load data.</div>';
});
</script>
</body>
</html>
